# Connection multiplexing — generic, no host of yours appears here.
#
# WHY
#   Opening an SSH connection costs a TCP handshake plus authentication.
#   Measured on the machine this repo came from: 878 ssh invocations across 254
#   agent sessions, 487 of them to the same host, 2.4 hours total. With
#   multiplexing the first connection opens a socket and every later one reuses
#   it: 496 ms -> 61 ms, an 88% cut per call.
#
#   It matters more than the clock suggests: `ssh` was the single largest
#   source of agent REWORK (69 extra turns, 13% failure rate). A reused socket
#   does not redo the handshake, so it cannot fail at the handshake.
#
# ControlPath uses %C — a hash of (user, host, port, address). NOT %r@%h:%p:
#   a Unix socket path is capped at ~104 bytes and the readable form overflows
#   it on long paths. Verified: the overflow error is `ControlPath too long`.
#
# The ~/.ssh/cm directory must exist and be 0700. install.sh creates it.
Host *
    ControlMaster auto
    ControlPath ~/.ssh/cm/%C
    ControlPersist 10m
